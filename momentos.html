<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentos - Naela Walter</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-panel { background: rgba(24, 24, 24, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-aqua { color: #00f5ff; }
        .accent-rose { color: #f43f5e; }
    </style>
</head>
<body class="w-screen h-screen pt-24 pb-20 px-6 relative overflow-x-hidden">

    <!-- HEADER IDÉNTICO AL HOME -->
    <header class="fixed top-0 left-0 w-full z-40 bg-gradient-to-b from-[#00f5ff]/10 to-transparent pt-10 pb-4 px-6 flex items-center gap-4">
        <img src="assets/perfil-naela.jpg" alt="Perfil" class="w-12 h-12 rounded-full object-cover border-2 border-[#00f5ff] shadow-lg bg-gray-800">
        <div>
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Bienvenida</p>
            <h1 class="text-xl font-bold">Hola, Naela Walter</h1>
        </div>
    </header>

    <main class="mt-4 pb-12">
        
        <!-- CONTENEDOR ESTILO CARPETA: Momentos -->
        <div class="glass-panel rounded-3xl p-5 border border-gray-700/50 shadow-2xl relative overflow-hidden mb-6">
            
            <!-- Encabezado de la carpeta -->
            <div class="flex items-center gap-3 mb-6 border-b border-gray-700/50 pb-4">
                <div class="w-10 h-10 rounded-full bg-rose-500/20 flex items-center justify-center border border-rose-500/30">
                    <i class="fa-solid fa-folder-open text-lg text-rose-400"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold tracking-wide">Momentos</h2>
                    <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Colección Privada</p>
                </div>
            </div>

            <!-- Contenido de la carpeta -->
            <div class="grid grid-cols-1 gap-5">
                
                <!-- TARJETA 1: La Propuesta -->
                <div onclick="window.location.href='propuesta.html?play=true'" class="bg-gradient-to-br from-rose-900 to-pink-950 rounded-2xl p-6 shadow-xl relative overflow-hidden transition-transform active:scale-95 cursor-pointer border border-rose-500/30">
                    <div class="relative z-10">
                        <i class="fa-solid fa-ring text-3xl mb-3 text-rose-300"></i>
                        <h3 class="text-xl font-bold">El Día Especial</h3>
                        <p class="text-rose-200 mt-1 text-xs">¿Quieres ser mi novia? 💍</p>
                    </div>
                    <div class="absolute -bottom-4 -right-4 w-32 h-32 bg-rose-500 rounded-full blur-2xl opacity-20"></div>
                </div>

                <!-- TARJETA 2: El Primer Mes -->
                <div onclick="window.location.href='primer-mes.html?play=true'" class="bg-gradient-to-br from-indigo-900 to-purple-950 rounded-2xl p-6 shadow-xl relative overflow-hidden transition-transform active:scale-95 cursor-pointer border border-indigo-500/30">
                    <div class="relative z-10">
                        <i class="fa-solid fa-images text-3xl mb-3 text-indigo-300"></i>
                        <h3 class="text-xl font-bold">Nuestro Primer Mes</h3>
                        <p class="text-indigo-200 mt-1 text-xs">Galería de nuestras aventuras 📸</p>
                    </div>
                    <div class="absolute -bottom-4 -right-4 w-32 h-32 bg-indigo-500 rounded-full blur-2xl opacity-20"></div>
                </div>

                <!-- TARJETA 3: El Segundo Mes -->
                <div onclick="window.location.href='segundo-mes.html?play=true'" class="bg-gradient-to-br from-emerald-900 to-teal-950 rounded-2xl p-6 shadow-xl relative overflow-hidden transition-transform active:scale-95 cursor-pointer border border-emerald-500/30">
                    <div class="relative z-10">
                        <i class="fa-solid fa-camera-retro text-3xl mb-3 text-emerald-300"></i>
                        <h3 class="text-xl font-bold">Nuestro Segundo Mes</h3>
                        <p class="text-emerald-200 mt-1 text-xs">Más recuerdos inolvidables 📸</p>
                    </div>
                    <div class="absolute -bottom-4 -right-4 w-32 h-32 bg-emerald-500 rounded-full blur-2xl opacity-20"></div>
                </div>

                <!-- TARJETA 4: El Tercer Mes -->
                <div onclick="window.location.href='tercer-mes.html?play=true'" class="bg-gradient-to-br from-amber-900 to-orange-950 rounded-2xl p-6 shadow-xl relative overflow-hidden transition-transform active:scale-95 cursor-pointer border border-amber-500/30">
                    <div class="relative z-10">
                        <i class="fa-solid fa-star text-3xl mb-3 text-amber-300"></i>
                        <h3 class="text-xl font-bold">Nuestro Tercer Mes</h3>
                        <p class="text-amber-200 mt-1 text-xs">Un trimestre mágico 🌟</p>
                    </div>
                    <div class="absolute -bottom-4 -right-4 w-32 h-32 bg-amber-500 rounded-full blur-2xl opacity-20"></div>
                </div>
                
            </div>
        </div>

    </main>

    <!-- BOTTOM NAV BAR (Estado Momentos Activo) -->
    <nav class="fixed bottom-0 left-0 w-full glass-panel bg-black/90 z-40 py-2 px-6">
        <div class="flex justify-around items-center h-16">
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#00f5ff] transition-colors">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="text-[10px]">Inicio</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-rose-400"> <!-- Activo -->
                <i class="fa-solid fa-heart text-xl"></i>
                <span class="text-[10px]">Momentos</span>
            </button>
            <button onclick="window.location.href='playlist.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-music text-xl"></i>
                <span class="text-[10px]">Playlist</span>
            </button>
        </div>
    </nav>

</body>
</html>
