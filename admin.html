<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naela Walter</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .accent-aqua { color: #00f5ff; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-8 shadow-2xl text-center">
        <h1 class="text-2xl font-bold mb-1">Validador de Regalos</h1>
        <p class="text-gray-400 mb-6 text-xs tracking-wider uppercase">Modo Administrador</p>

        <div id="admin-reader" class="w-full bg-black rounded-2xl overflow-hidden border border-gray-700 mb-6 min-h-[250px] shadow-inner"></div>

        <button id="start-btn" onclick="activarEscaner()" class="w-full bg-[#00f5ff] text-black font-bold py-3 rounded-full transition-transform active:scale-95 shadow-lg shadow-[#00f5ff]/20">
            <i class="fa-solid fa-qrcode mr-2"></i> Escanear Código Final
        </button>

        <div id="success-banner" class="hidden mt-6 bg-emerald-500/10 border-2 border-emerald-500 rounded-2xl p-6 animate-pulse">
            <i class="fa-solid fa-circle-check text-5xl text-emerald-400 mb-3"></i>
            <h2 class="text-xl font-bold text-emerald-400 mb-2">¡Código Verificado!</h2>
            <p class="text-sm text-gray-300">Entrega la Caja de Regalos Principal en este momento. ✨</p>
        </div>
    </div>

    <script>
        function activarEscaner() {
            document.getElementById('start-btn').classList.add('hidden');
            const scanner = new Html5Qrcode("admin-reader");
            
            scanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    if (decodedText === "REGALO_FINAL_NAELA_2026_VERIFICADO") {
                        scanner.stop();
                        document.getElementById('admin-reader').classList.add('hidden');
                        document.getElementById('success-banner').classList.remove('hidden');
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    } else {
                        alert("Código inválido o desconocido.");
                    }
                },
                () => {}
            ).catch(err => {
                alert("Error al abrir cámara: " + err);
                document.getElementById('start-btn').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
