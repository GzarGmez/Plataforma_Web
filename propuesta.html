<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Día Especial - Naela Walter</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-panel { background: rgba(24, 24, 24, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(244, 63, 94, 0.2); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="w-full min-h-screen relative overflow-x-hidden bg-gradient-to-br from-rose-950/30 to-[#121212]">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="fixed top-0 left-0 w-full z-40 bg-black/60 backdrop-blur-md pt-10 pb-4 px-6 flex items-center justify-between border-b border-rose-900/50">
        <button onclick="window.location.href='momentos.html'" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-rose-300 hover:text-white transition-colors cursor-pointer">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-lg font-bold text-rose-100 tracking-wide">El Día Especial</h1>
        <div class="w-10"></div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-6xl mx-auto pt-28 pb-24 px-4 sm:px-6">
        
        <!-- REPRODUCTOR DE MÚSICA PERSONALIZADO -->
        <div class="glass-panel rounded-2xl p-4 mb-8 shadow-xl shadow-rose-900/20 flex items-center gap-4 max-w-xl mx-auto">
            <button id="playBtn" class="w-12 h-12 rounded-full bg-rose-600 flex items-center justify-center text-white shadow-lg shadow-rose-600/40 active:scale-95 transition-transform cursor-pointer">
                <i class="fa-solid fa-play ml-1" id="playIcon"></i>
            </button>
            <div class="flex-1">
                <h3 class="font-bold text-sm text-rose-50">Nuestra Canción</h3>
                <p class="text-xs text-rose-300/70">El día que dijiste que sí 💍</p>
                <div class="w-full h-1.5 bg-gray-800 rounded-full mt-2 overflow-hidden">
                    <div id="progressBar" class="h-full bg-rose-500 w-0 transition-all duration-1000"></div>
                </div>
            </div>
            <audio id="bgMusic" src="assets/audio/cancion-propuesta.mp3" loop></audio>
        </div>

        <!-- GALERÍA GRID SIMÉTRICA -->
        <h2 class="text-xl font-bold mb-6 text-rose-200 px-2 text-center sm:text-left">Recuerdos</h2>
        <div id="gallery-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 px-2">
            <!-- Las 35 Polaroids se generan aquí de forma uniforme -->
        </div>

    </main>

    <!-- MODAL (LIGHTBOX) CON ZOOM Y NAVEGACIÓN -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        
        <!-- Botón Cerrar -->
        <button onclick="closeModal()" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-gray-800/80 flex items-center justify-center text-white text-xl z-50 hover:bg-rose-600 transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Controles de Navegación -->
        <button onclick="navigate(-1)" class="absolute left-2 sm:left-10 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center text-white/70 hover:text-white text-3xl z-50 drop-shadow-lg active:scale-90 transition-transform cursor-pointer">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="navigate(1)" class="absolute right-2 sm:right-10 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center text-white/70 hover:text-white text-3xl z-50 drop-shadow-lg active:scale-90 transition-transform cursor-pointer">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Imagen del Modal -->
        <div id="modalImgContainer" class="bg-[#fcfcfc] p-3 pb-12 rounded-md shadow-2xl transform scale-50 transition-all duration-300 ease-out max-w-md w-full max-h-[80vh] flex flex-col items-center">
            <img id="modalImg" src="" alt="Zoom" class="w-full h-full object-contain rounded-sm border border-gray-200/50 max-h-[65vh]">
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const galleryContainer = document.getElementById('gallery-container');
        const totalImages = 35; 
        let currentIndex = 0;   

        for (let i = 0; i < totalImages; i++) {
            const polaroid = document.createElement('div');
            polaroid.className = 'bg-[#fcfcfc] p-2.5 pb-8 rounded-sm shadow-lg cursor-pointer transition-all duration-300 hover:-translate-y-2 hover:shadow-rose-500/25 hover:scale-105 flex flex-col items-center';
            polaroid.onclick = () => openModal(i);

            const img = document.createElement('img');
            img.src = `assets/propuesta/IMG_${i + 1}.jpg`; 
            img.className = 'w-full aspect-square object-cover rounded-sm border border-gray-200/50';
            
            polaroid.appendChild(img);
            galleryContainer.appendChild(polaroid);
        }

        const modal = document.getElementById('imageModal');
        const modalImgContainer = document.getElementById('modalImgContainer');
        const modalImg = document.getElementById('modalImg');

        function openModal(index) {
            currentIndex = index;
            modalImg.src = `assets/propuesta/IMG_${currentIndex + 1}.jpg`;
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                modalImgContainer.classList.remove('scale-50');
                modalImgContainer.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modalImgContainer.classList.remove('scale-100');
            modalImgContainer.classList.add('scale-50');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            
            setTimeout(() => modalImg.src = '', 300);
        }

        function navigate(direction) {
            currentIndex += direction;
            
            if (currentIndex < 0) currentIndex = totalImages - 1;
            if (currentIndex >= totalImages) currentIndex = 0;
            
            modalImgContainer.classList.add('opacity-50', 'scale-95');
            
            setTimeout(() => {
                modalImg.src = `assets/propuesta/IMG_${currentIndex + 1}.jpg`;
                modalImgContainer.classList.remove('opacity-50', 'scale-95');
            }, 150);
        }

        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.classList.add('ml-1');
            } else {
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-pause');
                playIcon.classList.remove('ml-1');
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${progress}%`;
        });
    </script>
</body>
</html>
